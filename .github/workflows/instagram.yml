name: MidWorld Today (Instagram)

on:
  schedule:
    # shortly after the video bulletin's midnight slots (Beirut local):
    - cron: "15 21 * * *"   # 00:15 local during EEST (UTC+3)
    - cron: "15 22 * * *"   # 00:15 local during EET  (UTC+2)
    # The off-season run finds the deck already rendered for the day and
    # exits; the publish step is deduplicated by the .last_ig marker.
  workflow_dispatch:
    inputs:
      target_date:
        description: "Build slides for one specific day (YYYY-MM-DD)."
        required: false
        default: ""
      force:
        description: "Set to 1 to re-render even if today's deck exists."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  slides:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Skip off-season schedule run
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OFFSET=$(TZ=Asia/Beirut date +%z)
          if { [ "$OFFSET" = "+0200" ] && [ "$SCHEDULE" = "15 22 * * *" ]; } \
            || { [ "$OFFSET" = "+0300" ] && [ "$SCHEDULE" = "15 21 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping non-current Beirut DST cron (offset=$OFFSET schedule=$SCHEDULE)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.schedule_gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        if: steps.schedule_gate.outputs.run == 'true'
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Install dependencies
        if: steps.schedule_gate.outputs.run == 'true'
        run: pip install -q -r requirements.txt

      - name: Render slides
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          SOURCE_CHANNEL: midworldnews
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIMEZONE: Asia/Beirut
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          FORCE_SLIDES: ${{ github.event.inputs.force }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: python insta_slides.py render

      # Commit all slide assets before Instagram fetches them from their public raw URLs.
      - name: Commit slides
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain slides)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add slides/
            git commit -m "Slides: $(date -u +%F)"
            git pull --rebase origin main || true
            git push
          fi

      - name: Publish to Instagram
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FORCE_SLIDES: ${{ github.event.inputs.force }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIMEZONE: Asia/Beirut
        run: python insta_slides.py publish

      - name: Record post marker
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain .last_ig)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last_ig
            git commit -m "Record Instagram post: $(cat .last_ig)"
            git pull --rebase origin main || true
            git push
          fi

      - name: Render optional Reel
        if: steps.schedule_gate.outputs.run == 'true' && vars.PUBLISH_REEL == 'true'
        continue-on-error: true
        env:
          SOURCE_CHANNEL: midworldnews
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIMEZONE: Asia/Beirut
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: python insta_slides.py render-reel

      - name: Commit Reel asset
        if: steps.schedule_gate.outputs.run == 'true' && vars.PUBLISH_REEL == 'true'
        continue-on-error: true
        run: |
          if [ -f slides/latest/reel.mp4 ] && [ -n "$(git status --porcelain slides/latest/reel.mp4)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add slides/latest/reel.mp4
            git commit -m "Reel: $(date -u +%F)"
            git pull --rebase origin main || true
            git push
          fi

      - name: Publish optional Reel
        if: steps.schedule_gate.outputs.run == 'true' && vars.PUBLISH_REEL == 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: python insta_slides.py publish-reel

      - name: Record Reel marker
        if: steps.schedule_gate.outputs.run == 'true' && vars.PUBLISH_REEL == 'true'
        run: |
          if [ -f slides/latest/.last_ig_reel ] && [ -n "$(git status --porcelain slides/latest/.last_ig_reel)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add slides/latest/.last_ig_reel
            git commit -m "Record Instagram Reel: $(cat slides/latest/.last_ig_reel)"
            git pull --rebase origin main || true
            git push
          fi
