name: MidWorld Daily

on:
  schedule:
    # GitHub cron is always UTC. Two runs are scheduled so that exactly one of
    # them falls inside the local 00:00 hour in Beirut year round:
    - cron: "0 21 * * *"   # = 00:00 local while EEST (UTC+3) is in effect
    - cron: "0 22 * * *"   # = 00:00 local while EET  (UTC+2) is in effect
    # The run that isn't at local midnight exits immediately, so only one
    # brief is ever published per day.
    # Catch-up: hours after midnight, publishes yesterday's brief ONLY if the
    # midnight run failed (checked against the .last_published marker) — a
    # Gemini outage at midnight then costs a late bulletin, not a missing one.
    - cron: "0 4 * * *"    # = 06:00/07:00 local
  workflow_dispatch:
    inputs:
      target_date:
        description: "Rebuild one specific day (YYYY-MM-DD). Leave empty for a normal run."
        required: false
        default: ""
      dry_run:
        description: "Set to 1 to render a preview artifact WITHOUT posting to Telegram."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Build and publish the brief
        env:
          SOURCE_CHANNEL: midworldnews
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIMEZONE: Asia/Beirut
          # Brian is edge's warmest, most conversational voice — reads like a
          # person talking to a person rather than a machine reading a page.
          VOICE: en-US-BrianMultilingualNeural
          # "edge" gives one consistent, free, reliable voice every day. Gemini
          # TTS sounds more human but its free-tier quota can't cover a full
          # bulletin, so set "gemini" only once the key has billing enabled (the
          # bulletin then uses one voice throughout, falling back to edge if the
          # quota is ever short).
          VOICE_ENGINE: edge
          MAKE_VIDEO: "1"
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          # Which cron fired, so resolve_day() can tell the midnight run, the
          # off-season one (exits) and the catch-up one apart. Empty on manual
          # (workflow_dispatch) runs, which then always publish.
          CRON_SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python daily_news.py

      - name: Record publish date
        if: ${{ success() }}
        run: |
          if [ -n "$(git status --porcelain .last_published)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last_published
            git commit -m "Record publish: $(cat .last_published)"
            git pull --rebase origin main || true
            git push
          fi

      - name: Upload preview (dry run only)
        if: ${{ always() && hashFiles('preview.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: brief-preview
          path: preview.mp4
